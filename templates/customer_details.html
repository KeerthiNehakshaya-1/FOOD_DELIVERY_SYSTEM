<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Details - FoodFlow</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            🍔
        </div>

        <h1>FoodFlow</h1>

        <p class="auth-subtitle">
            Enter your details to continue
        </p>

        {% if error %}
            <div class="message error">
                {{ error }}
            </div>
        {% endif %}

        <div class="login-section">

            <h2>Customer Details</h2>

            <p class="login-description">
                Please enter your details to access the FoodFlow
                customer ordering portal.
            </p>

            <form method="POST"
                  action="{{ url_for('customer_details') }}">

                <div class="form-group">
                    <label for="name">Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>

                    <input
                        type="text"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>

                    <textarea
                        id="address"
                        name="address"
                        rows="3"
                        placeholder="Enter your delivery address"
                        required></textarea>
                </div>

                <button type="submit" class="btn-primary">
                    Continue to FoodFlow
                </button>

            </form>

        </div>

        <div class="auth-note">
            Your details will be used for placing and delivering orders.
        </div>

    </div>

</div>

</body>
</html>
